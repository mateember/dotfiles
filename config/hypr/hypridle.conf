# The dpms commands use Lua dispatcher syntax: Hyprland in Lua config mode only accepts Lua
# in `hyprctl dispatch`.
# hypridle itself still uses the hyprlang format (unchanged upstream).
general {
    # Wait until Hyprland reports the session as locked before letting the system sleep.
    # The default (2, auto) only waits when the commands mention hyprlock, so it would not wait here.
    inhibit_sleep = 3
    lock_cmd = ~/.config/hypr/scripts/lock.sh                                        # Quickshell lock screen (Howdy + password), own instance.
    before_sleep_cmd = ~/.config/hypr/scripts/lock.sh sleep; playerctl pause-all       # Lock first (WITHOUT starting Howdy), then pause media.
    # Start PAM/Howdy on wake, turn the display back on immediately, and re-apply
    # the cursor (Hyprland 0.57 clears the DRM cursor plane on DPMS off).
    after_sleep_cmd = ~/.config/hypr/scripts/lock.sh wake; hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; ~/.config/hypr/scripts/reassert-cursor.sh
}

listener {
    timeout = 600                                 # 10 min
    on-timeout = systemctl suspend                # suspend (before_sleep_cmd locks first)
    
}

listener {
    timeout = 250                                 # 4 min 10 s
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'        # screen off, 5 s after locking
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; ~/.config/hypr/scripts/reassert-cursor.sh # screen on + restore cursor when activity is detected after timeout has fired.
}

listener {
    timeout = 245                                 # 4 min 5 s
    on-timeout = loginctl lock-session        # lock (runs lock_cmd)
}
