# The dpms commands use Lua dispatcher syntax: Hyprland in Lua config mode only accepts Lua
# in `hyprctl dispatch`.
# hypridle itself still uses the hyprlang format (unchanged upstream).
general {
    lock_cmd = qs ipc call lock lock                                     # Native Quickshell lock screen (Howdy + password).
    before_sleep_cmd = playerctl pause-all; qs ipc call lock lockForSleep # Pause media & lock WITHOUT starting Howdy before suspend.
    # Start PAM/Howdy on wake, turn the display back on immediately, and re-apply
    # the cursor (Hyprland 0.57 clears the DRM cursor plane on DPMS off).
    after_sleep_cmd = qs ipc call lock wakeFromSleep; hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; ~/.config/hypr/scripts/reassert-cursor.sh
}

listener {
    timeout = 600                            # in seconds.
    on-timeout = systemctl suspend # command to run when timeout has passed.
    
}

listener {
    timeout = 250                                 # 5.5min
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'        # screen off when timeout has passed
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'; ~/.config/hypr/scripts/reassert-cursor.sh # screen on + restore cursor when activity is detected after timeout has fired.
}

listener {
    timeout = 245                                 # 5.5min
    on-timeout = loginctl lock-session        # screen off when timeout has passed
    #on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })'          # screen on when activity is detected after timeout has fired.
}
